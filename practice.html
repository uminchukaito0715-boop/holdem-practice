<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0e"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<title>練習モード｜Hold'em</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap">
<style>
/* ===== 練習モード：本番アプリと同じデザイン（白・黒・赤、黒フチのステッカー風） ===== */
#poker-trainer{
  --bg:transparent;--surface-1:rgba(18,18,22,.86);--surface-2:#24242a;
  --border:rgba(255,255,255,.14);--border-strong:#111;--border-accent:#e0262d;
  --text-primary:#ffffff;--text-secondary:#c9c9d1;--text-muted:#8d8d96;
  --text-danger:#ff5a5f;--text-success:#5cf09a;--text-warning:#ffc84a;
  --btn-bg:#26262b;--btn-hover:#303036;--radius:14px;
  --red:#e0262d;
}
html{background:#0b0b0e}
body{margin:0;min-height:100vh;color:#fff;background:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(8,8,10,.55),rgba(8,8,10,.82) 40%,rgba(8,8,10,.93)),var(--bg-img) center top/cover no-repeat}
#poker-trainer{max-width:520px;margin:0 auto;padding:12px 16px calc(28px + env(safe-area-inset-bottom,0px));box-sizing:border-box;background:var(--bg);color:var(--text-primary);
  font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Hiragino Sans',sans-serif;font-weight:700}
#poker-trainer *{box-sizing:border-box}

/* 上のバー：ロゴと戻るボタン */
.pt-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 6px}
.pt-logo{width:118px;aspect-ratio:900/253;background:var(--logo) center/contain no-repeat;filter:drop-shadow(0 3px 5px rgba(0,0,0,.6))}
.pt-back{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:999px;background:linear-gradient(180deg,#2c2c31,#111114);border:2px solid #fff;box-shadow:0 0 0 2px #000,0 3px 0 #000;color:#fff;text-decoration:none;font-weight:900;font-size:13px}
.pt-title{margin:4px 0 12px;font-weight:900;font-size:22px;letter-spacing:.04em;text-shadow:0 2px 0 #000}
.pt-title small{display:block;font-size:12px;font-weight:700;color:var(--text-secondary);letter-spacing:0;text-shadow:none;margin-top:2px}

/* ボタン：黒フチの厚いボタン（フォールド＝黒、コール＝白、レイズ・ベット＝赤） */
#poker-trainer button{background:linear-gradient(180deg,#3a3a41,#1f1f24);color:#fff;border:2.5px solid #111;border-radius:var(--radius);font:inherit;font-weight:900;cursor:pointer;
  box-shadow:0 5px 0 #000,0 8px 14px rgba(0,0,0,.45);position:relative;transition:transform .06s,box-shadow .06s}
#poker-trainer button:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #000}
#poker-trainer button:hover:not(:disabled){filter:brightness(1.08)}
#poker-trainer button:disabled{opacity:.45;cursor:default}
#poker-trainer #pt-bC{background:linear-gradient(180deg,#fff,#e4e4df);color:#111}
#poker-trainer #pt-bR,#poker-trainer #pt-next{background:linear-gradient(180deg,#ff545a,#e0262d 55%,#c11b21);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
#poker-trainer #pt-bA{background:#111;color:#ff5a5f;border-color:#ff5a5f;box-shadow:0 0 0 2px #000,0 5px 0 #000}
#poker-trainer #pt-diag{background:linear-gradient(180deg,#fff,#e4e4df);color:#111}
#poker-trainer #pt-reset{box-shadow:0 3px 0 #000;background:#1b1b1f;color:var(--text-secondary)}
#poker-trainer input{background:#fff;color:#111;border:2.5px solid #111;border-radius:var(--radius);padding:0 14px;font:inherit;font-family:'Alfa Slab One',sans-serif;font-weight:400;box-shadow:inset 0 2px 4px rgba(0,0,0,.2)}
#poker-trainer input:focus{outline:none;border-color:var(--red)}
#poker-trainer p{margin:0}

/* トランプ：本番と同じ白いカード、太い数字、4色 */
#poker-trainer .cd{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:46px;height:64px;border-radius:7px;margin-right:6px;
  background:linear-gradient(165deg,#fff 0%,#fbfaf6 55%,#eeece4 100%);color:#111;box-shadow:0 0 0 1.5px #111,0 2px 0 #bdbab1,0 5px 10px rgba(0,0,0,.5);
  font-family:'Alfa Slab One',sans-serif;font-weight:400;font-size:21px;line-height:1;letter-spacing:-.04em;vertical-align:top}
#poker-trainer .cd>span{font-family:'Segoe UI Symbol','Apple Symbols',Arial,sans-serif;font-size:18px;letter-spacing:0}
#poker-trainer .cd.s{width:32px;height:44px;font-size:14px;margin-right:4px;border-radius:5px;box-shadow:0 0 0 1.5px #111,0 3px 6px rgba(0,0,0,.45)}
#poker-trainer .cd.s>span{font-size:12px}
#poker-trainer .cd.r,#poker-trainer .cd.sh{color:#d71920}
#poker-trainer .cd.sd{color:#1565d8}
#poker-trainer .cd.sc{color:#0f8a3f}
#poker-trainer .cd.e{background:rgba(255,255,255,.05);box-shadow:inset 0 2px 6px rgba(0,0,0,.25);border:1.5px solid rgba(255,255,255,.18);color:rgba(255,255,255,.35)}

/* 文字・情報 */
#poker-trainer .lb{font-size:12px;color:var(--text-secondary);margin:0 0 6px;font-weight:800}
#poker-trainer .chip{font-size:12px;padding:4px 11px;border-radius:999px;background:#111;border:1.5px solid rgba(255,255,255,.75);color:#fff;font-weight:800}
#poker-trainer .chip:first-child{background:var(--red);border-color:#fff}
#poker-trainer .ab{min-height:50px;font-size:15px}
#poker-trainer #pt-prog,#poker-trainer #pt-tot{color:#fff!important;font-weight:900}
#poker-trainer #pt-tot{font-family:'Alfa Slab One',sans-serif;font-weight:400;letter-spacing:.02em}
#poker-trainer #pt-sit{font-weight:700}
#poker-trainer #pt-err{font-weight:800}

/* 問題のテーブル：本番と同じ、黒い縁＋赤白ライン＋緑のフェルト */
#poker-trainer .table{position:relative;border-radius:22px;padding:16px 14px;
  background:radial-gradient(ellipse 70% 55% at 50% 40%,rgba(255,255,255,.14),transparent 70%),radial-gradient(ellipse at 50% 40%,#2fa874 0%,#1e8257 45%,#135c3c 80%,#0c4029 100%);
  box-shadow:0 0 0 3px #fff,0 0 0 7px #e0262d,0 0 0 10px #000,0 0 0 18px #19191c,0 0 0 20px #000,0 20px 40px rgba(0,0,0,.7),inset 0 10px 24px rgba(0,0,0,.45);
  margin:20px 20px 0}
#poker-trainer .table .lb{color:rgba(255,255,255,.75)}
#poker-trainer .table #pt-sit{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);background:rgba(0,0,0,.28);border-radius:12px;padding:10px 12px}
#poker-trainer #pt-ctl{margin-top:30px!important}

/* 結果と見返し */
#poker-trainer #pt-res:not(:empty){background:var(--surface-1);border:2px solid #fff;box-shadow:0 0 0 2px #000,0 5px 0 #000;border-radius:16px;padding:14px}
#poker-trainer #pt-res span[style*="font-size:24px"]{font-family:'Alfa Slab One',sans-serif;font-weight:400!important;font-size:30px!important;text-shadow:0 2px 0 #000}
#poker-trainer details{border-top:1px solid var(--border);padding:12px 4px}
#poker-trainer summary{cursor:pointer;font-size:14px;line-height:1.55;list-style:none}
#poker-trainer summary::-webkit-details-marker{display:none}
#poker-trainer #pt-hist{background:var(--surface-1);border-radius:16px;padding:0 10px}
#poker-trainer #pt-hist:empty{display:none}
#poker-trainer .pt-sec{font-size:18px!important;font-weight:900!important;text-shadow:0 2px 0 #000}
@media (min-width:600px){#poker-trainer{padding-top:20px}}

/* ===== 本当の試合のようなテーブル ===== */
#poker-trainer .pt-info{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 4px}
#poker-trainer .table.pt-felt{position:relative;display:flex;flex-direction:column;justify-content:space-between;align-items:center;gap:6px;
  min-height:430px;margin:34px 14px 0;padding:0 10px;border-radius:190px/150px;
  background:radial-gradient(ellipse 60% 45% at 50% 45%,rgba(255,255,255,.16),transparent 70%),radial-gradient(ellipse at 50% 45%,#2fa874 0%,#1e8257 40%,#135c3c 75%,#0c4029 100%);
  box-shadow:0 0 0 3px #fff,0 0 0 7px #e0262d,0 0 0 9px #000,0 0 0 24px #19191c,0 0 0 26px #000,0 24px 50px rgba(0,0,0,.8),inset 0 12px 26px rgba(0,0,0,.55),inset 0 0 70px rgba(0,0,0,.4)}
#poker-trainer .table.pt-felt::after{content:'';position:absolute;inset:9%;border-radius:inherit;border:2px solid rgba(255,255,255,.1);pointer-events:none}
#poker-trainer .table.pt-felt::before{content:'';position:absolute;left:50%;top:60%;width:46%;aspect-ratio:900/253;transform:translate(-50%,-50%);background:var(--logo) center/contain no-repeat;opacity:.12;filter:grayscale(1) brightness(2);pointer-events:none}
/* 相手の席（テーブルの上の縁に乗せる） */
#poker-trainer .pt-opps{display:flex;justify-content:center;gap:14px;width:100%;margin-top:-30px;position:relative;z-index:1}
#poker-trainer .pt-opps.n2{justify-content:space-between;padding:0 4px}
#poker-trainer .pt-seat{position:relative;display:flex;flex-direction:column;align-items:center}
#poker-trainer .pt-backs{display:flex;margin-bottom:-14px;position:relative;z-index:0}
#poker-trainer .cd.bk{width:30px;height:42px;margin:0 -3px;transform:rotate(-6deg);
  background:radial-gradient(circle at 50% 50%,transparent 0 30%,rgba(255,255,255,.9) 30% 36%,transparent 36%),repeating-linear-gradient(45deg,rgba(255,255,255,.14) 0 2px,transparent 2px 6px),linear-gradient(160deg,#ff4a50,#c4161d 60%,#8f0d12);
  border:2px solid #fff;box-shadow:0 0 0 1.5px #111,0 4px 8px rgba(0,0,0,.5)}
#poker-trainer .cd.bk+.cd.bk{transform:rotate(6deg)}
/* 名札：本番と同じ白いステッカー */
#poker-trainer .pt-plate{position:relative;z-index:1;display:flex;align-items:center;gap:7px;min-width:122px;height:42px;padding:0 12px 0 4px;border-radius:999px;
  background:linear-gradient(180deg,#fff 0%,#f1f1ee 55%,#dcdcd6 100%);border:2.5px solid #111;box-shadow:0 4px 0 #000,0 8px 14px rgba(0,0,0,.55)}
#poker-trainer .pt-av{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9d9d,#d04545 70%);
  color:#fff;font-family:'Alfa Slab One',sans-serif;font-weight:400;font-size:10px;letter-spacing:0;box-shadow:0 0 0 2px #111;text-shadow:0 1px 1px rgba(0,0,0,.5)}
#poker-trainer .pt-av.me{background:radial-gradient(circle at 35% 30%,#7fb2ff,#2f6fd0 70%)}
#poker-trainer .pt-nm{display:flex;flex-direction:column;line-height:1.1;text-align:left}
#poker-trainer .pt-nm b{color:#111;font-size:13px;font-weight:900}
#poker-trainer .pt-nm small{color:#e0262d;font-size:11px;font-weight:900}
/* 相手の賭け額：席とテーブル中央の間に置く */
#poker-trainer .pt-bet{margin-top:10px;display:inline-flex;align-items:center;gap:5px;padding:2px 10px 2px 4px;border-radius:999px;background:#111;border:1.5px solid #fff;box-shadow:0 0 0 1.5px #000,0 3px 0 #000;
  color:#fff;font-family:'Alfa Slab One',sans-serif;font-weight:400;font-size:13px}
#poker-trainer .pt-bet i,#poker-trainer .pt-pot i{width:16px;height:16px;border-radius:50%;background:repeating-conic-gradient(#e0262d 0 30deg,#fff 30deg 45deg);box-shadow:0 0 0 1.5px #111;
  -webkit-mask:radial-gradient(circle,#000 0 100%);position:relative}
#poker-trainer .pt-bet i::after,#poker-trainer .pt-pot i::after{content:'';position:absolute;inset:4px;border-radius:50%;background:#e0262d}
/* 中央：POT と場のカード */
#poker-trainer .pt-center{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;z-index:1}
#poker-trainer .pt-pot{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 16px 0 10px;border-radius:999px;background:linear-gradient(180deg,#2a2a2f,#0e0e11);border:2px solid #fff;
  box-shadow:0 0 0 2px #000,0 4px 0 #000;color:#ff8a8e;font-size:12px;font-weight:900;letter-spacing:.1em}
#poker-trainer .pt-pot b{color:#fff;font-family:'Alfa Slab One',sans-serif;font-weight:400;font-size:17px;letter-spacing:.02em}
#poker-trainer #pt-stl{display:none}
#poker-trainer .pt-board{display:flex;gap:5px;justify-content:center}
#poker-trainer .pt-board .cd{margin:0;width:50px;height:70px;font-size:23px}
#poker-trainer .pt-board .cd>span{font-size:19px}
/* 自分：大きな手札と名札（テーブルの下の縁に乗せる） */
#poker-trainer .pt-hero{display:flex;flex-direction:column;align-items:center;margin-bottom:-26px;position:relative;z-index:1}
#poker-trainer #pt-hl{display:none}
#poker-trainer .pt-hand{display:flex;margin-bottom:-12px}
#poker-trainer .pt-hand .cd{width:60px;height:84px;font-size:28px;margin:0 -2px;transform:rotate(-5deg)}
#poker-trainer .pt-hand .cd+.cd{transform:rotate(5deg)}
#poker-trainer .pt-hand .cd>span{font-size:24px}
#poker-trainer .pt-plate.me{min-width:150px;height:48px;border-width:3px}
#poker-trainer .pt-plate.me .pt-av{width:36px;height:36px;font-size:11px}
/* 状況の説明：テーブルの下の札 */
#poker-trainer .pt-sit{margin:44px 0 0!important;padding:12px 14px;border-radius:16px;background:var(--surface-1);border:2px solid #fff;box-shadow:0 0 0 2px #000,0 4px 0 #000;font-size:14px;line-height:1.65;font-weight:700}
#poker-trainer .pt-sit:empty{display:none}
#poker-trainer #pt-ctl{margin-top:16px!important}
@media (max-width:360px){#poker-trainer .table.pt-felt{margin-inline:8px}#poker-trainer .pt-board .cd{width:44px;height:62px;font-size:20px}#poker-trainer .pt-plate{min-width:108px}}
/* スマホ縦で操作ボタンまで1画面に収める */
#poker-trainer .pt-title{margin:0 0 8px;font-size:19px}
#poker-trainer .table.pt-felt{min-height:372px}
#poker-trainer .pt-board .cd{width:46px;height:64px;font-size:21px}
#poker-trainer .pt-hand .cd{width:54px;height:76px;font-size:25px}

<div id="poker-trainer">
  <div class="pt-top"><div class="pt-logo" role="img" aria-label="Hold'em"></div><a class="pt-back" href="poker.html">← テーブルに戻る</a></div>
  <h1 class="pt-title">練習モード<small>実際によくある場面で、あなたならどうする？</small></h1>
  <div style="display:flex;justify-content:space-between;margin-bottom:10px">
    <span id="pt-prog" style="font-size:13px;color:var(--text-secondary)"></span>
    <span id="pt-tot" style="font-size:13px;color:var(--text-secondary)"></span>
  </div>
  <div id="pt-info" class="pt-info"></div>
  <div class="table pt-felt" id="pt-tbl">
    <div id="pt-opps" class="pt-opps"></div>
    <div class="pt-center"><div id="pt-pot" class="pt-pot"></div><p class="lb" id="pt-stl">ボード</p><div id="pt-board" class="pt-board"></div></div>
    <div class="pt-hero"><p class="lb" id="pt-hl">あなたの手札</p><div id="pt-hand" class="pt-hand"></div><div id="pt-me" class="pt-plate me"></div></div>
  </div>
  <p id="pt-sit" class="pt-sit"></p>
  <div id="pt-ctl" style="margin-top:12px">
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
      <button class="ab" id="pt-bF">フォールド</button>
      <button class="ab" id="pt-bC"></button>
    </div>
    <div id="pt-rz" style="margin-top:10px">
      <p class="lb" id="pt-rzl"></p>
      <div style="display:flex;gap:8px">
        <input id="pt-amt" type="number" inputmode="numeric" placeholder="金額を入力" style="flex:1;min-width:0;height:46px;font-size:16px">
        <button class="ab" id="pt-bR" style="min-width:96px"></button>
      </div>
      <p id="pt-err" style="font-size:13px;color:var(--text-danger);margin:6px 0 0;min-height:18px"></p>
      <button class="ab" id="pt-bA" style="width:100%;margin-top:4px"></button>
    </div>
  </div>
  <div id="pt-res" style="margin-top:12px"></div>
  <button id="pt-next" class="ab" style="width:100%;margin-top:10px;display:none">次のハンドへ</button>

  <div style="margin-top:24px">
    <p class="pt-sec" style="font-size:16px;font-weight:500;margin:0 0 4px">見返す</p>
    <p id="pt-hc" style="font-size:13px;color:var(--text-secondary);margin:0 0 8px"></p>
    <button id="pt-diag" class="ab" style="width:100%;margin-bottom:6px;display:none">タイプ診断用のテキストをコピー</button>
    <p id="pt-dmsg" style="font-size:12px;color:var(--text-muted);margin:0 0 6px"></p>
    <div id="pt-hist"></div>
    <button id="pt-reset" style="margin-top:16px;min-height:40px;font-size:13px;padding:0 14px;color:var(--text-secondary)">記録をすべてリセット</button>
  </div>
</div>

<script>
(function(){
"use strict";

/* =====================================================================
   1. 問題データ
   ---------------------------------------------------------------------
   pos  : 自分のポジション      opp : 相手      pot : ポット
   st   : ストリート            b   : ボード    h   : 手札
   t    : 状況の説明
   tc   : コールに必要な額（0ならベットなし）
   fa   : 現在の最大ベット額（レイズの最小額は fa×2）
   mx   : 自分が出せる最大額（オールイン額）

/* =====================================================================
   2. 設定
   ===================================================================== */
const ROUND_SIZE=8;                       // 1ラウンドの出題数
const STORAGE_KEY="pokerTrainer.v1";      // 保存に使うキー

/* =====================================================================
   3. 保存（出題済み・履歴をブラウザに保存。使えない環境では保存なしで動く）
   ===================================================================== */
function load(){try{const d=JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}");return{seen:Array.isArray(d.seen)?d.seen:[],hist:Array.isArray(d.hist)?d.hist:[]}}catch(e){return{seen:[],hist:[]}}}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({seen,hist}))}catch(e){}}

/* =====================================================================
   4. 採点ロジック
   ===================================================================== */
const minRaise=s=>s.fa>0?s.fa*2:2;
function sizeScore(s,a){
  if(a>=s.mx)return s.ai;
  let inBand=-1,near=null,dist=Infinity;
  for(const[lo,hi,sc]of s.bd){
    if(a>=lo&&a<=hi)inBand=Math.max(inBand,sc);
    const d=a<lo?(lo-a)/lo:a>hi?(a-hi)/hi:0;
    if(d<dist){dist=d;near=sc}
  }
  if(inBand>=0)return inBand;
  if(near===null)return 5;
  return Math.max(5,Math.round(near-dist*80)); // 理想の額から離れるほど減点
}

/* =====================================================================
   5. 画面
   ===================================================================== */
const $=id=>document.getElementById("pt-"+id);
const byId=Object.fromEntries(HANDS.map(h=>[h.id,h]));
let {seen,hist}=load();
seen=seen.filter(id=>byId[id]);hist=hist.filter(x=>byId[x.id]);
let Q=[],i=0,tot=0,done=false,cur=null,mode="play";

const isRed=c=>/[♥♦]/.test(c);
const card=(c,sm)=>`<span class="cd${sm?" s":""}${isRed(c)?" r":""} s${({"♠":"s","♥":"h","♦":"d","♣":"c"})[c.slice(-1)]||""}">${c.slice(0,-1)==="T"?"10":c.slice(0,-1)}<span>${c.slice(-1)}</span></span>`;
const col=v=>v>=85?"var(--text-success)":v>=50?"var(--text-warning)":"var(--text-danger)";
const BTN=["bF","bC","bR","bA"];

/* 相手の席：「CO＋BTN」は2人、「ブラインド2人」はSBとBB。（）の中は相手のタイプ */
function oppList(s){
  if(/ブラインド/.test(s.opp))return[{p:"SB",t:""},{p:"BB",t:""}];
  const t=(s.opp.match(/（(.+?)）/)||[])[1]||"";
  return s.opp.replace(/（.+?）/g,"").split("＋").map(p=>({p:p.trim(),t}));
}
function renderTable(s){
  const os=oppList(s);
  $("opps").className="pt-opps n"+os.length;
  $("opps").innerHTML=os.map((o,k)=>'<div class="pt-seat"><div class="pt-backs"><span class="cd bk"></span><span class="cd bk"></span></div>'+
    '<div class="pt-plate"><span class="pt-av">'+o.p+'</span><span class="pt-nm"><b>相手</b><small>'+(o.t||"&nbsp;")+'</small></span></div>'+
    (k===os.length-1&&s.tc>0?'<div class="pt-bet"><i></i>'+s.fa+'</div>':'')+'</div>').join("");
  $("pot").innerHTML='<i></i>POT <b>'+s.pot+'</b>';
  $("me").innerHTML='<span class="pt-av me">'+s.pos+'</span><span class="pt-nm"><b>あなた</b><small>残り '+s.mx+'</small></span>';
}
function start(){
  const unseen=HANDS.filter(h=>!seen.includes(h.id));
  if(!unseen.length){showEmpty();return}
  Q=unseen.sort(()=>Math.random()-0.5).slice(0,ROUND_SIZE);
  i=0;tot=0;mode="play";
  $("stl").textContent="ボード";$("hl").textContent="あなたの手札";$("ctl").style.display="block";
  show();
}
function showEmpty(){
  ["info","board","hand","res"].forEach(x=>$(x).innerHTML="");$("tbl").style.display="none";
  $("ctl").style.display="none";$("stl").textContent="";$("hl").textContent="";
  $("prog").textContent="全問出題済み";$("tot").textContent="";$("next").style.display="none";
  $("sit").textContent=`全${HANDS.length}ハンドを出題しました。下の履歴から見返せます。`;
}
function show(){
  done=false;cur=Q[i];const s=cur;$("tbl").style.display="";$("sit").style.display="";renderTable(s);
  if(!seen.includes(s.id)){seen.push(s.id);save()}
  $("prog").textContent=`ハンド ${i+1} / ${Q.length}　未出題 残り${HANDS.length-seen.length}`;
  $("tot").textContent=`合計 ${tot}点`;
  $("info").innerHTML=[s.st,"ポジション "+s.pos,"相手 "+s.opp,"ポット "+s.pot,s.tc>0?"コールに必要 "+s.tc:"ベットなし"].map(t=>`<span class="chip">${t}</span>`).join("");
  let b=s.b.map(c=>card(c)).join("");for(let k=s.b.length;k<5;k++)b+=`<span class="cd e">?</span>`;
  $("board").innerHTML=b;$("sit").textContent=s.t;$("hand").innerHTML=s.h.map(c=>card(c)).join("");
  $("res").innerHTML="";$("next").style.display="none";$("err").textContent="";$("amt").value="";
  $("bF").style.display=s.tc>0?"block":"none";
  $("bC").textContent=s.tc>0?`コール ${s.tc}`:"チェック";
  $("rz").style.display=s.mx>s.fa?"block":"none";
  const raise=s.fa>0;
  $("bR").textContent=raise?"レイズ":"ベット";
  $("rzl").textContent=raise?`レイズ後の合計額（${minRaise(s)}〜${s.mx}）`:`ベット額（2〜${s.mx}）`;
  $("bA").textContent=`オールイン ${s.mx}`;
  BTN.forEach(id=>{$(id).disabled=false;$(id).style.border=""});
}
function finish(label,v,btn){
  done=true;const s=cur;tot+=v;
  BTN.forEach(x=>$(x).disabled=true);$(btn).style.border="2px solid var(--border-accent)";
  $("res").innerHTML=`<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:6px"><span style="font-size:13px;color:var(--text-secondary)">${label}</span><span style="font-size:24px;font-weight:500;color:${col(v)}">${v}点</span></div><p style="font-size:13px;color:var(--text-secondary);margin:0 0 4px">ベスト：${s.best}</p><p style="font-size:14px;line-height:1.7">${s.e}</p>`;
  hist.unshift({id:s.id,label,v,at:Date.now()});save();renderHist();
  $("tot").textContent=`合計 ${tot}点`;
  $("next").textContent=i<Q.length-1?"次のハンドへ":"結果を見る";$("next").style.display="block";
}
function renderHist(){
  const avg=hist.length?Math.round(hist.reduce((a,x)=>a+x.v,0)/hist.length):0;
  $("hc").textContent=hist.length?`${hist.length}ハンド　平均 ${avg}点　タップで詳細`:"まだ履歴はありません";
  $("diag").style.display=hist.length?"block":"none";
  $("hist").innerHTML=hist.map(x=>{const s=byId[x.id];
    const b=s.b.map(c=>card(c,1)).join("")||'<span style="font-size:13px;color:var(--text-muted)">なし（プリフロップ）</span>';
    return `<details><summary><span style="color:${col(x.v)};font-weight:500">${x.v}点</span>　${s.h.join(" ")}　${s.st}<br><span style="font-size:13px;color:var(--text-secondary)">あなた：${x.label}</span></summary><div style="margin-top:8px"><p class="lb">ボード</p><div style="margin-bottom:8px">${b}</div><p style="font-size:13px;color:var(--text-secondary);margin:0 0 6px">${s.pos}・相手 ${s.opp}・ポット ${s.pot}</p><p style="font-size:14px;line-height:1.6;margin:0 0 6px">${s.t}</p><p style="font-size:13px;margin:0 0 4px">ベスト：${s.best}</p><p style="font-size:14px;line-height:1.7;color:var(--text-secondary)">${s.e}</p></div></details>`}).join("");
}

/* =====================================================================
   6. タイプ診断
   ---------------------------------------------------------------------
   AIに送るためのテキストを作る。
   ・window.PokerTrainer.onDiagnose が設定されていれば、それにテキストを渡す
     （自分のアプリでAI APIに送る処理をここにつなげる）
   ・設定がなければクリップボードにコピーする（AIチャットに貼り付けて使う）
   ===================================================================== */
function buildDiagnosisText(){
  const avg=Math.round(hist.reduce((a,x)=>a+x.v,0)/hist.length);
  const lines=hist.slice().reverse().map((x,n)=>{const s=byId[x.id];
    return `${n+1}. ${x.v}点｜${s.st}・${s.pos}・相手${s.opp}｜手札 ${s.h.join(" ")}｜ボード ${s.b.join(" ")||"なし"}｜状況：${s.t}｜自分の行動：${x.label}｜ベスト：${s.best}`}).join("\n");
  return `ポーカー実践ボードの結果（${hist.length}ハンド、平均${avg}点）から、私のプレイタイプ（タイト／ルース、パッシブ／アグレッシブ、ベットサイズの傾向など）を診断して、直すべき点を優先順位つきで教えて。\n\n${lines}`;
}
function diagnose(){
  const text=buildDiagnosisText();
  const hook=window.PokerTrainer&&window.PokerTrainer.onDiagnose;
  if(typeof hook==="function"){hook(text,hist.map(x=>({...x,hand:byId[x.id]})));return}
  const msg=t=>{$("dmsg").textContent=t};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>msg("コピーしました。AIチャットに貼り付けて送ってください。"),()=>fallbackCopy(text,msg));
  }else fallbackCopy(text,msg);
}
function fallbackCopy(text,msg){
  const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");msg("コピーしました。AIチャットに貼り付けて送ってください。")}catch(e){msg("コピーできませんでした。")}
  ta.remove();
}

/* =====================================================================
   7. ボタンの動作
   ===================================================================== */
$("bF").onclick=()=>{if(!done)finish("フォールド",cur.fo,"bF")};
$("bC").onclick=()=>{if(done)return;const s=cur;
  if(s.tc>0)finish(s.tc>=s.mx?`コール ${s.tc}（オールイン）`:`コール ${s.tc}`,s.ca,"bC");
  else finish("チェック",s.ch,"bC")};
$("bA").onclick=()=>{if(!done)finish(`オールイン ${cur.mx}`,cur.ai,"bA")};
$("amt").oninput=()=>{$("err").textContent=""};
$("bR").onclick=()=>{if(done)return;const s=cur,raw=$("amt").value,a=Math.round(+raw),mn=minRaise(s);
  if(!raw){$("err").textContent="金額を入力してください";return}
  if(a<mn){$("err").textContent=`${mn}以上を入力してください`;return}
  if(a>s.mx){$("err").textContent=`最大は${s.mx}です`;return}
  finish(a>=s.mx?`オールイン ${a}`:`${s.fa>0?"レイズ":"ベット"} ${a}`,sizeScore(s,a),"bR")};
$("next").onclick=()=>{
  if(mode==="result"){start();return}
  if(!done)return;
  if(i<Q.length-1){i++;show();return}
  mode="result";
  const n=Q.length,avg=Math.round(tot/n),left=HANDS.length-seen.length;
  ["info","board","hand","res"].forEach(x=>$(x).innerHTML="");$("tbl").style.display="none";
  $("ctl").style.display="none";$("stl").textContent="";$("hl").textContent="";$("prog").textContent="結果";$("tot").textContent="";
  $("sit").innerHTML=`<span style="font-size:22px;font-weight:500">平均 ${avg}点</span><br>合計 ${tot} / ${n*100}点　未出題 残り${left}ハンド`;
  $("res").innerHTML=`<p style="font-size:14px;line-height:1.7">${avg>=90?"金額まで自分で決めてこの点数は見事です。":avg>=75?"悩ましい場面でも、大きなミスはありません。":"難問なので気にしすぎなくて大丈夫。下の履歴で解説を見返しましょう。"}</p>`;
  if(left){$("next").textContent="まだ出ていない問題で続ける";$("next").style.display="block"}else $("next").style.display="none";
};
$("diag").onclick=diagnose;
$("reset").onclick=()=>{if(!confirm("出題済みの記録と履歴をすべて消します。よろしいですか？"))return;
  seen=[];hist=[];save();renderHist();$("dmsg").textContent="";start()};

/* 外部から使えるようにする（任意） */
window.PokerTrainer=Object.assign(window.PokerTrainer||{},{
  hands:HANDS,
  getHistory:()=>hist.map(x=>({...x,hand:byId[x.id]})),
  getDiagnosisText:()=>hist.length?buildDiagnosisText():"",
  reset:()=>{seen=[];hist=[];save();renderHist();start()}
});

renderHist();start();
})();
</script>
